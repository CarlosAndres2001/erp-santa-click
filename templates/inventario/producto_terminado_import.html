{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-success bg-opacity-10 border-0">
            <h2 class="mb-0">
                <i class="bi bi-file-earmark-excel-fill me-2 text-success"></i> 
                Importar Productos Terminados
            </h2>
        </div>
        <div class="card-body">
            <div class="alert alert-info alert-dismissible fade show" role="alert">
                <i class="bi bi-info-circle me-2"></i>
                Todos los productos que importes aquí se crean como <strong>variante única</strong>.
                Si un SKU ya existe, ese producto se actualiza en vez de duplicarse.
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="mb-4">
                <a href="{% static 'plantillas/plantilla_productos_terminados.xlsx' %}" class="btn btn-outline-secondary">
                    <i class="bi bi-download me-1"></i> Descargar plantilla Excel
                </a>
            </div>

            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="row g-3 align-items-center">
                    <div class="col-md-8">
                        <div class="input-group">
                            <span class="input-group-text bg-light">
                                <i class="bi bi-upload text-success"></i>
                            </span>
                            <input type="file" name="archivo_excel" accept=".xlsx" class="form-control" required>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success flex-grow-1">
                                <i class="bi bi-eye-fill me-1"></i> Ver y revisar
                            </button>
                            <a href="{% url 'producto_list' %}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left"></i> Volver
                            </a>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
