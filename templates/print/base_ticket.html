<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<title>{{ titulo }}</title>

<style>

body{
    font-family: Arial, sans-serif;
    width: 80mm;
    margin:0;
    padding:10px;
    font-size:12px;
}

.ticket-header{
    text-align:center;
    margin-bottom:10px;
}

.ticket-header h4{
    margin:0;
}

.ticket-section{
    margin-top:10px;
}

.row{
    display:flex;
    justify-content:space-between;
}

.line{
    border-top:1px dashed #000;
    margin:8px 0;
}

@media print{

    @page{
        size:80mm auto;
        margin:0;
    }

}

</style>

</head>

<body>

{% block content %}
{% endblock %}

<script>
window.onload = function(){
    window.print();
}
</script>

</body>
</html>
